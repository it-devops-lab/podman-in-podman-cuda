# Konfiguration des inneren (rootless) Podman im äußeren Container

[containers]
# Seccomp des äußeren Containers verbietet sethostname ohne CAP_SYS_ADMIN
# (gleiche Einstellung wie im offiziellen quay.io/podman/stable-Image)
utsns = "host"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
# crun 1.14 (RHEL 8) mountet sysfs erst rw und braucht danach mount_setattr(),
# das Kernel 4.18 nicht hat; runc mountet sysfs direkt read-only.
runtime = "runc"
